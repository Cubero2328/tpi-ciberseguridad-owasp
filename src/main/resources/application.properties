# Configuración del servidor
server.port=8080

# Configuración de base de datos MySQL (Tus credenciales intactas)
spring.datasource.url=jdbc:mysql://localhost:3306/xss_demo_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Fidel13/09
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate para MySQL
spring.jpa.hibernate.ddl-auto=update
# OPTIMIZACIÓN DE VELOCIDAD: Apagamos el formateo de logs pesados en la consola de VS Code
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# En caso de no contar con MySQL activo localmente, descomentar las siguientes líneas de H2 para pruebas inmediatas:
# spring.datasource.url=jdbc:h2:mem:xssdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true

# Deshabilitar vista previa en caché para DevTools
spring.thymeleaf.cache=false
